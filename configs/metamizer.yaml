    <<: *DEFAULT_DATA
    dataset_size: 1000
    use_cloth: 1
    use_fluid: 0
    use_diffusion: 0
    use_poisson: 0
    height: 32
    width: 32

  cloth:
    <<: *DEFAULT_CLOTH

  # Weights and biases
  wandb:
    <<: *DEFAULT_WANDB
    log: false

  inference:
    <<: *inference_f5 #inference_author_ckpt1
